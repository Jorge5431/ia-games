project_id = "vornelix-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Confirme sua conta Vornelix"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha Vornelix"
content_path = "./supabase/templates/recovery.html"
